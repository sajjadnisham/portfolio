</head><body><script type="module">
// Lab: check the procedural face shapes. ?states=b,s|b,s|...&zoom=0.28
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { buildFace } from '/assets/js/face.js';
const q = new URLSearchParams(location.search);
const states = (q.get('states') || '0,0|0.5,0|1,0|0,1|0,0.5').split('|').map((s) => s.split(',').map(Number));
const Z = +(q.get('zoom') || 0.28), side = +(q.get('side') || 0);

av.updateMatrixWorld(true);

window.__done = true;
</script></body></html>
